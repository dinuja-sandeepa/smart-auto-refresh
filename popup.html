<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Smart Auto Refresh</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --surface-color: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --success: #10b981;
            --border: #334155;
            --radius: 8px
        }

        #setCustom {
            background: var(--primary)
        }

        #stopActive {
            background: var(--danger)
        }

        #stopActive:hover {
            background: var(--danger-hover)
        }

        #resetActive:hover {
            background: var(--border)
        }

        #resetActive {
            background: var(--surface-color);
            border: 1px solid var(--border);
            color: var(--text-main)
        }

        body {
            font-family: 'Inter', sans-serif;
            width: 320px;
            margin: 0;
            padding: 16px;
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow-x: hidden;
            overflow-y: overlay
        }

        body::-webkit-scrollbar {
            display: none
        }

        body {
            -ms-overflow-style: none;
            scrollbar-width: none
        }

        h3,
        h4 {
            margin: 0 0 12px 0;
            font-weight: 600;
            color: var(--text-main);
            font-size: 14px;
            letter-spacing: .5px;
            text-transform: uppercase;
            color: var(--text-muted)
        }

        .section {
            background: var(--surface-color);
            padding: 16px;
            border-radius: var(--radius);
            margin-bottom: 16px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / .1), 0 2px 4px -1px rgb(0 0 0 / .06)
        }

        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 12px
        }

        input[type="number"],
        select {
            background: var(--bg-color);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 8px;
            border-radius: var(--radius);
            outline: none;
            font-family: inherit;
            font-size: 14px;
            transition: border-color 0.2s
        }

        input[type="number"] {
            width: 60px
        }

        select {
            flex: 1;
            cursor: pointer
        }

        input[type="number"]:focus,
        select:focus {
            border-color: var(--primary)
        }

        button {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 10px 12px;
            border-radius: var(--radius);
            cursor: pointer;
            font-weight: 500;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px
        }

        button:hover {
            background: var(--primary-hover);
            transform: translateY(-1px)
        }

        button:active {
            transform: translateY(0)
        }

        button.full-width {
            width: 100%
        }

        #presets {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 16px
        }

        #presets button {
            background: var(--bg-color);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 8px
        }

        #presets button:hover {
            background: var(--border);
            border-color: var(--text-muted)
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-main);
            cursor: pointer;
            margin-bottom: 16px;
            padding: 8px;
            border-radius: 6px;
            transition: background 0.2s;
            background: rgb(255 255 255 / .02);
            border: 1px solid #fff0
        }

        .checkbox-group:hover {
            background: rgb(255 255 255 / .06);
            border-color: var(--border)
        }

        .checkbox-group input[type="checkbox"] {
            -webkit-appearance: none;
            appearance: none;
            background-color: var(--surface-color);
            margin: 0;
            width: 36px;
            height: 20px;
            min-width: 36px;
            border: 1px solid var(--border);
            border-radius: 20px;
            position: relative;
            cursor: pointer;
            outline: none;
            transition: border-color 0.2s, background-color 0.2s
        }

        .checkbox-group input[type="checkbox"]::before {
            content: "";
            position: absolute;
            top: 2px;
            left: 2px;
            width: 14px;
            height: 14px;
            background-color: var(--text-muted);
            border-radius: 50%;
            transition: transform 0.2s cubic-bezier(.4, 0, .2, 1), background-color 0.2s;
            box-shadow: 0 1px 2px rgb(0 0 0 / .2)
        }

        .checkbox-group input[type="checkbox"]:checked {
            background-color: var(--primary);
            border-color: var(--primary)
        }

        .checkbox-group input[type="checkbox"]:checked::before {
            transform: translateX(16px);
            background-color: #fff
        }

        #status {
            font-size: 13px;
            color: var(--success);
            text-align: center;
            min-height: 18px;
            margin-bottom: 8px;
            font-weight: 500;
            transition: all 0.3s
        }

        #active-timer-display {
            display: none;
            text-align: center;
            font-size: 32px;
            font-weight: 600;
            color: var(--primary);
            background: rgb(59 130 246 / .1);
            padding: 16px;
            border-radius: var(--radius);
            margin-bottom: 16px;
            border: 1px solid rgb(59 130 246 / .2);
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / .1);
            letter-spacing: 1px;
            animation: pulse 2s cubic-bezier(.4, 0, .6, 1) infinite
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1
            }

            50% {
                opacity: .8
            }
        }

        .global-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px
        }

        #startAll {
            grid-column: 1 / -1;
            background: var(--success)
        }

        #startAll:hover {
            background: #059669
        }

        #stopAll {
            background: var(--danger)
        }

        #stopAll:hover {
            background: var(--danger-hover)
        }

        #resetAll {
            background: var(--bg-color);
            border: 1px solid var(--border);
            color: var(--text-main)
        }

        #resetAll:hover {
            background: var(--border)
        }

        .header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border)
        }

        .header h2 {
            background: linear-gradient(135deg, #93c5fd, #c4b5fd);
            -webkit-background-clip: text;
            background-clip: text;
            color: #e0f2fe;
            -webkit-text-fill-color: #fff0
        }

        .header-icon {
            font-size: 24px;
            filter: drop-shadow(0 2px 4px rgb(0 0 0 / .2))
        }

        .scroll-indicator {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 30px;
            background: linear-gradient(to top, var(--bg-color), transparent);
            pointer-events: none;
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 4px;
            opacity: 1;
            transition: opacity 0.3s
        }

        .scroll-indicator::after {
            content: '⌄';
            color: var(--text-muted);
            font-size: 20px;
            animation: bounce 1.5s infinite
        }

        @keyframes bounce {

            0%,
            100% {
                transform: translateY(0)
            }

            50% {
                transform: translateY(-4px)
            }
        }
    </style>
</head>

<body>
    <div class="header"><span class="header-icon"><img src="icons/Ghost32.webp" alt="logo"></span>
        <h2>Smart Auto Refresh</h2>
    </div>
    <div id="active-timer-display"></div>
    <div class="section">
        <h3>Current Tab</h3>
        <div class="input-group" id="fixed-interval-group"><input type="number" id="interval" min="1" value="30"><select
                id="unit">
                <option value="seconds">Seconds</option>
                <option value="minutes">Minutes</option>
                <option value="hours">Hours</option>
            </select></div>
        <div id="presets"><button data-interval="5" data-unit="seconds">5 Sec</button><button data-interval="30"
                data-unit="seconds">30 Sec</button><button data-interval="1" data-unit="minutes">1 Min</button><button
                data-interval="5" data-unit="minutes">5 Min</button></div>
        <div id="random-interval-options"
            style="display: none; background: rgba(0,0,0,0.1); padding: 12px; border-radius: 6px; margin-bottom: 12px; border: 1px dashed var(--border);">
            <label class="checkbox-group" style="margin-bottom: 8px;"><input type="checkbox" id="fullyRandom">Fully
                Random (1s - 1hr) </label>
            <div id="random-range-group">
                <div style="font-size: 12px; color: var(--text-muted); margin-bottom: 4px;">Minimum Time</div>
                <div class="input-group" style="margin-bottom: 8px;"><input type="number" id="randomMin" min="1"
                        value="10"><select id="randomMinUnit">
                        <option value="seconds">Seconds</option>
                        <option value="minutes">Minutes</option>
                        <option value="hours">Hours</option>
                    </select></div>
                <div style="font-size: 12px; color: var(--text-muted); margin-bottom: 4px;">Maximum Time</div>
                <div class="input-group" style="margin-bottom: 0;"><input type="number" id="randomMax" min="1"
                        value="60"><select id="randomMaxUnit">
                        <option value="seconds">Seconds</option>
                        <option value="minutes">Minutes</option>
                        <option value="hours">Hours</option>
                    </select></div>
            </div>
        </div><label class="checkbox-group" style="margin-bottom: 12px;"><input type="checkbox" id="isRandom">Randomize
            Refresh Interval </label><label class="checkbox-group" style="margin-bottom: 12px;"><input type="checkbox"
                id="hardRefresh">Hard Refresh (bypass cache) </label><label class="checkbox-group"
            style="margin-bottom: 16px; margin-top: -8px;"><input type="checkbox" id="unlimitedRefresh" checked>Refresh
            Unlimited Times </label>
        <div class="input-group" id="times-group" style="display: none;"><input type="number" id="refreshTimes" min="1"
                placeholder="1"><span
                style="display: flex; align-items: center; color: var(--text-muted); font-size: 14px;">Total
                times</span></div>
        <div class="global-controls" style="margin-top: 16px;"><button id="setCustom"
                style="grid-column: 1 / -1;">Start</button><button id="stopActive">Stop</button><button
                id="resetActive">Reset</button></div>
    </div>
    <div class="scroll-indicator" id="scrollIndicator"></div>
    <script src="popup.js"></script>
</body>

</html>
